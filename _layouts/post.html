---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <p class="post-back">
    <a href="{{ '/' | relative_url }}" id="back-to-list">&larr; 목록으로</a>
  </p>
  <script>
    // 목록 페이지에서 곧장 들어온 경우에만 history.back() — 브라우저가 스크롤
    // 위치까지 복원해줌. "지난 편"/"다음 편"으로 글끼리 이동해온 경우나 직접
    // 링크로 들어온 경우는 그냥 '/'로(뒤로가기가 목록이 아니라 이전 글로 갈 수 있어서).
    (function () {
      var link = document.getElementById('back-to-list');
      var homePath = '{{ "/" | relative_url }}';
      var ref = document.referrer;
      if (!ref) return;
      var refPath = new URL(ref).pathname;
      if (refPath === homePath && history.length > 1) {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          history.back();
        });
      }
    })();
  </script>
  <script>
    // 스크린샷(.demo-images img) 클릭하면 원본 크기에 가깝게 확대해서 보여줌 —
    // 작게 표시되는 터미널 캡처 등을 실제로 읽을 수 있게.
    (function () {
      var images = document.querySelectorAll('.demo-images img');
      if (!images.length) return;
      var overlay = document.createElement('div');
      overlay.className = 'lightbox-overlay';
      var overlayImg = document.createElement('img');
      overlay.appendChild(overlayImg);
      document.body.appendChild(overlay);

      images.forEach(function (el) {
        el.addEventListener('click', function () {
          overlayImg.src = el.src;
          overlayImg.alt = el.alt;
          overlay.classList.add('active');
        });
      });
      overlay.addEventListener('click', function () {
        overlay.classList.remove('active');
      });
    })();
  </script>
</article>
